<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Health | HridyaCare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root { 
        --bg: #0f172a; 
        --card-bg: #1e293b; 
        --text: #fff; 
        --muted: #94a3b8; 
        --accent: #f43f5e; 
        --gradient: linear-gradient(135deg, #f43f5e, #be123c);
    }

    body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing: antialiased; }

    /* Header */
    .header { padding:20px; display:flex; gap:15px; align-items:center; backdrop-filter: blur(10px); position: sticky; top:0; z-index: 10; background: rgba(15, 23, 42, 0.8); }
    .back { color:#fff; text-decoration:none; font-size:24px; padding: 5px; border-radius: 50%; transition: 0.2s; }
    .back:active { background: rgba(255,255,255,0.1); }
    
    .container { padding: 0 20px 20px 20px; }

    /* The Main Stat Card */
    .big-card { 
        background: var(--gradient); 
        border-radius: 24px; 
        padding: 24px; 
        margin-bottom: 30px; 
        position: relative; 
        overflow: hidden;
        box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.4);
    }
    
    .big-card-content { position: relative; z-index: 2; }
    .stat-label { opacity:0.9; font-size:13px; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; }
    
    .stat-row { display: flex; align-items: baseline; gap: 8px; margin: 5px 0 10px 0; }
    .stat-val { font-size:42px; font-weight:800; }
    .stat-unit { font-size: 16px; font-weight: 600; opacity: 0.8; }
    
    .stat-desc { font-size:14px; background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 12px; border-radius: 20px; }

    /* Decorative Waveform behind Big Card */
    .waveform {
        position: absolute; bottom: -10px; right: 0; width: 100%; opacity: 0.3; z-index: 1; pointer-events: none;
    }

    /* Section Title */
    .section-title { 
        color: var(--text); 
        font-size: 18px; 
        font-weight: 700; 
        margin-bottom: 15px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }
    .see-all { font-size: 13px; color: var(--accent); text-decoration: none; }

    /* The Grid Layout */
    .topic-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; /* Two columns */
        gap: 15px; 
    }

    /* Individual Card Style */
    .topic-card { 
        position: relative;
        height: 140px;
        background: var(--card-bg); 
        border-radius: 20px; 
        text-decoration: none; 
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s;
    }
    
    .topic-card:active { transform: scale(0.98); }

    /* Card Background Image */
    .card-bg {
        position: absolute;
        width: 100%; height: 100%;
        object-fit: cover;
        opacity: 0.6; /* Dim image slightly */
        transition: opacity 0.3s;
    }

    /* Gradient Overlay so text is readable */
    .card-overlay {
        position: absolute;
        width: 100%; height: 100%;
        background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.1) 100%);
    }

    /* Card Text Content */
    .card-content { 
        position: relative; 
        z-index: 2; 
        height: 100%; 
        padding: 15px; 
        display: flex; 
        flex-direction: column; 
        justify-content: flex-end; /* Push text to bottom */
        box-sizing: border-box;
    }

    .topic-name { color: #fff; font-weight: 600; font-size: 15px; line-height: 1.3; }
    .topic-sub { color: #cbd5e1; font-size: 11px; margin-top: 4px; }

    /* Wide card spans 2 columns */
    .wide { grid-column: span 2; }
    
    /* Animation for Heart Icon */
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
    .pulsing-icon { display: inline-block; animation: pulse 2s infinite ease-in-out; margin-right: 5px; }

</style>
</head>
<body>

<div class="header">
    <a href="/health" class="back">←</a>
    <h2 style="margin:0; font-size:18px; font-weight: 600;">Heart Health Hub</h2>
</div>

<div class="container">
    
    <div class="big-card">
        <div class="big-card-content">
            <div class="stat-label"><span class="pulsing-icon">❤️</span> Live Heart Rate</div>
            <div class="stat-row">
                <span class="stat-val">72</span>
                <span class="stat-unit">BPM</span>
            </div>
            <div class="stat-desc">Normal Resting Range</div>
        </div>
        <svg class="waveform" viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
            <path fill="#ffffff" fill-opacity="1" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,250.7C960,235,1056,181,1152,165.3C1248,149,1344,171,1392,181.3L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>

    <div class="section-title">
        <span>Knowledge Base</span>
        <a href="#" class="see-all">View All</a>
    </div>
    
    <div class="topic-grid">
        
        <a href="/article/resting-heart-rate" class="topic-card">
            <img src="https://images.unsplash.com/photo-1552674605-469555942da1?auto=format&fit=crop&w=300&q=80" class="card-bg" alt="Running">
            <div class="card-overlay"></div>
            <div class="card-content">
                <div class="topic-name">Resting HR</div>
                <div class="topic-sub">Why lower is better</div>
            </div>
        </a>

        <a href="/article/stress-connection" class="topic-card">
            <img src="https://images.unsplash.com/photo-1508964942454-1a5628444869?auto=format&fit=crop&w=300&q=80" class="card-bg" alt="Stress">
            <div class="card-overlay"></div>
            <div class="card-content">
                <div class="topic-name">Stress & Heart</div>
                <div class="topic-sub">The connection</div>
            </div>
        </a>

        <a href="/article/heart-healthy-diet" class="topic-card wide">
            <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=600&q=80" class="card-bg" alt="Diet">
            <div class="card-overlay"></div>
            <div class="card-content">
                <div class="topic-name">Cardiac Nutrition Guide</div>
                <div class="topic-sub">7 foods to include in your diet</div>
            </div>
        </a>

    </div>
</div>

</body>
</html>

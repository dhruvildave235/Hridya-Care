<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | HridyaCare</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Unified Color Palette */
  --bg: #0f172a;
  --bg-gradient: radial-gradient(circle at top right, #1e293b, #0f172a);
  --card: rgba(30, 41, 59, 0.7);
  --border: rgba(255, 255, 255, 0.08);
  --primary: #ff4d6d;
  --primary-glow: rgba(255, 77, 109, 0.3);
  --soft-bg: rgba(255, 77, 109, 0.08);
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --radius-lg: 24px;
  --radius-md: 12px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.auth-page {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  z-index: 1;
}

/* Background Decoration */
.auth-page::before {
  content: '';
  position: absolute;
  width: 300px;
  height: 300px;
  background: var(--primary);
  filter: blur(120px);
  opacity: 0.15;
  top: 10%;
  left: 10%;
  z-index: -1;
}

.auth-card {
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  text-align: center;
}

.auth-title {
  font-family: 'Poppins';
  font-size: 28px;
  letter-spacing: -1px;
  background: linear-gradient(to right, #fff, var(--primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.auth-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 32px;
}

/* Form Styles */
.field {
  margin-bottom: 20px;
  position: relative;
  text-align: left;
}

input {
  width: 100%;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  color: var(--text-main);
  font-size: 15px;
  transition: var(--transition);
}

input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(15, 23, 42, 0.9);
  box-shadow: 0 0 0 4px var(--soft-bg);
}

/* Password Toggle Layout */
.password-field {
  display: flex;
  align-items: center;
}

.toggle-password {
  position: absolute;
  right: 14px;
  cursor: pointer;
  font-size: 18px;
  user-select: none;
  opacity: 0.6;
  transition: opacity 0.2s;
}

.toggle-password:hover {
  opacity: 1;
}

.btn {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  margin-top: 10px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px var(--primary-glow);
}

.btn:active {
  transform: translateY(0);
}

.auth-link {
  margin-top: 24px;
  font-size: 14px;
  color: var(--text-muted);
}

.auth-link a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  margin-left: 4px;
}

.auth-link a:hover {
  text-decoration: underline;
}

/* Alerts */
.auth-alert {
  background: rgba(239, 68, 68, 0.1);
  border-left: 3px solid #ef4444;
  color: #f87171;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 20px;
  text-align: left;
}

</style>
</head>

<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-title">HridyaCare</div>
        <div class="auth-subtitle">
            Sign in to continue your health analysis
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="auth-alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="field">
                <input type="email" name="email" placeholder="Email address" required>
            </div>

            <div class="field password-field">
                <input
                    type="password"
                    name="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >
                <span
                    class="toggle-password"
                    onclick="togglePassword('login-password', this)"
                    title="Show / Hide password"
                >👁</span>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="auth-link">
            New here? <a href="{{ url_for('register') }}">Create an account</a>
        </div>
    </div>
</div>

<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁";
    }
}
</script>

</body>
</html>
